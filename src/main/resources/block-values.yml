# Points each block adds to an island's value (level = value / points-per-level in config.yml).
# Only placed blocks are scanned: entities (armor stands, boats, item frames...) never count.
#
# A key can be:
#   - a block name                    DIAMOND_BLOCK: 300
#   - a block tag, prefixed with #    '#minecraft:logs': 1
#   - a name pattern with * wildcards '*_CONCRETE': 1
#   - a spawner type                  'MOB_SPAWNER:BLAZE': 500
# A block listed by name overrides any tag or pattern it also matches. Unknown keys are reported
# in the console on load. Breaking a block worth at least level.valuable-threshold (config.yml)
# requires the VALUABLE_BREAK permission.
