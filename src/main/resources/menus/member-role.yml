id: "island-member-role"
title: "Choisir un rôle"
size: 54
use-player-inventory: true

layouts:
  roles:
    taint: "role"
    provider: "%parameters_island_assignableRoles%"

items:
  role:
    slots: [1,2,3,4,5,6,7,10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
    copy-from: "%parameter_role_item%"
    name: "<primary_color><bold>%parameter_role_name%"
    lore:
      - ""
      - "  <text_color>Poids : <secondary_color>%parameter_role_weight%"
      - ""
      - "<white>Clic gauche <gray>Attribuer ce rôle"
    taints:
      - "role"
    actions:
      - "[set-member-role] %parameters_island% %parameters_member_playerId% %parameter_role%"
      # Delayed so the menu shows the new role rather than the one the write is replacing.
      - "[open-menu] island-member-manage:island=%parameters_island%:member=%parameters_member% <delay=10>"

  back:
    slot: 49
    material: "ARROW"
    name: "<bold><primary_color>Retour"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-member-manage:island=%parameters_island%:member=%parameters_member%"
