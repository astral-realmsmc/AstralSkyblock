id: "island-confirm-kick"
title: "Expulser le membre ?"
size: 54
use-player-inventory: true

items:
  confirm:
    slot: 14
    material: "LIME_CONCRETE"
    name: "<bold><primary_color>Expulser le membre"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[kick-member] %parameters_island% %parameters_member_playerId%"
      - "[open-menu] island-members:island=%parameters_island% <delay=10>"

  cancel:
    slot: 12
    material: "RED_CONCRETE"
    name: "<bold><primary_color>Annuler"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-member-manage:island=%parameters_island%:member=%parameters_member%"
