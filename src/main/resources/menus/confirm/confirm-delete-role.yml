id: "island-confirm-delete-role"
title: "Supprimer le rôle ?"
size: 54
use-player-inventory: true

items:
  confirm:
    slot: 14
    material: "LIME_CONCRETE"
    name: "<bold><red>Supprimer le rôle %parameters_role_name%"
    lore:
      - ""
      - "  <text_color>Ses membres recevront le <secondary_color>rôle par défaut<text_color>."
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[delete-role] %parameters_island% %parameters_role%"
      - "[open-menu] island-roles:island=%parameters_island% <delay=10>"

  cancel:
    slot: 12
    material: "RED_CONCRETE"
    name: "<bold><primary_color>Annuler"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-roles:island=%parameters_island%"
