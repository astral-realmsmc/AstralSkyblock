id: "island-confirm-delete-warp"
title: "Supprimer le warp ?"
size: 54
use-player-inventory: true

items:
  confirm:
    slot: 14
    material: "LIME_CONCRETE"
    name: "<bold><primary_color>Supprimer le warp"
    lore:
      - ""
      - "  <text_color>Warp : <secondary_color>%parameters_warp%"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[delete-warp] %parameters_island% %parameters_warp%"
      - "[open-menu] island-warps:island=%parameters_island% <delay=10>"

  cancel:
    slot: 12
    material: "RED_CONCRETE"
    name: "<bold><primary_color>Annuler"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-warps:island=%parameters_island%"
