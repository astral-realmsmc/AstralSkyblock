id: "island-confirm-transfer"
title: "Transférer l'île ?"
size: 54
use-player-inventory: true

items:
  confirm:
    slot: 14
    material: "LIME_CONCRETE"
    name: "<bold><red>Donner l'île à %parameters_member_player_name%"
    lore:
      - ""
      - "  <text_color>Vous deviendrez <secondary_color>administrateur<text_color> de l'île."
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[transfer-ownership] %parameters_island% %parameters_member%"
      - "[open-menu] island-members:island=%parameters_island% <delay=10>"

  cancel:
    slot: 12
    material: "RED_CONCRETE"
    name: "<bold><primary_color>Annuler"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-member-manage:island=%parameters_island%:member=%parameters_member%"
