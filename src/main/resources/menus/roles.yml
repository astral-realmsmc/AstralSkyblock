id: "island-roles"
title: "Rôles"
size: 54
use-player-inventory: true

layouts:
  roles:
    taint: "role"
    provider: "%parameters_island_roles%"

items:
  default-role:
    priority: 2
    slots: [ 1,2,3,4,5,6,7,10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43 ]
    copy-from: "%parameter_role_item%"
    name: "<primary_color><bold>%parameter_role_name%"
    lore:
      - ""
      - "  <text_color>Poids : <secondary_color>%parameter_role_weight%"
      - ""
      - "<white>Clic gauche <gray>Modifier les permissions"
      - "<white>Clic droit <gray>Modifier le rôle"
      - "<warning>Rôle par défaut : il ne peut pas être supprimé"
    taints:
      - "role"
    view-requirements:
      - "[compare] %parameter_role_default% == true"
    left-click-actions:
      - "[open-menu] island-permissions:island=%parameters_island%:role=%parameter_role%"
    right-click-actions:
      - "[open-dialog] island-role-edit:island=%parameters_island%:role=%parameter_role%"

  role:
    priority: 1
    slots: [ 1,2,3,4,5,6,7,10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43 ]
    copy-from: "%parameter_role_item%"
    name: "<primary_color><bold>%parameter_role_name%"
    lore:
      - ""
      - "  <text_color>Poids : <secondary_color>%parameter_role_weight%"
      - ""
      - "<white>Clic gauche <gray>Modifier les permissions"
      - "<white>Clic droit <gray>Modifier le rôle"
      - "<white>Maj + clic gauche <gray>Supprimer le rôle"
      - "<white>Maj + clic droit <gray>Définir comme rôle par défaut"
    taints:
      - "role"
    left-click-actions:
      - "[open-menu] island-permissions:island=%parameters_island%:role=%parameter_role%"
    right-click-actions:
      - "[open-dialog] island-role-edit:island=%parameters_island%:role=%parameter_role%"
    shift-left-click-actions:
      - "[open-menu] island-confirm-delete-role:island=%parameters_island%:role=%parameter_role%"
    shift-right-click-actions:
      - "[set-default-role] %parameters_island% %parameter_role%"
      - "[refresh] <delay=10>"

  create:
    slot: 48
    material: "LIME_DYE"
    name: "<bold><primary_color>Créer un nouveau rôle"
    actions:
      - "[close]"
      - "[open-dialog] island-role-create:island=%parameters_island%"

  back:
    slot: 49
    material: "ARROW"
    name: "<bold><primary_color>Retour"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-main:island=%parameters_island%"
