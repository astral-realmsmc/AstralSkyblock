id: "island-upgrades"
title: "%img_internal:neg_8%<white>%img_guis:generic_list%%img_internal:neg_112%<font:alphabet:shift_1>ameliorations"
size: 54
use-player-inventory: true

layouts:
  upgrades:
    taint: "upgrade"
    provider: "%parameters_island_upgrades%"

items:
  upgrade:
    slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
    material: "EXPERIENCE_BOTTLE"
    name: "<primary_color><bold>%parameter_upgrade_type%"
    lore-modifiers:
      progress:
        type: conditional
        entries:
          maxed:
            priority: 10
            requirements:
              - "[compare] %parameter_upgrade_isMax% == true"
            content:
              - "  <text_color>Niveau : <secondary_color>%parameter_upgrade_level%<text_color>/<secondary_color>%parameter_upgrade_maxLevel%"
              - "  <text_color>Valeur : <secondary_color>%parameter_upgrade_value%"
              - ""
              - "<green>Niveau maximum atteint."
          upgradable:
            priority: 0
            content:
              - "  <text_color>Niveau : <secondary_color>%parameter_upgrade_level%<text_color>/<secondary_color>%parameter_upgrade_maxLevel%"
              - "  <text_color>Valeur : <secondary_color>%parameter_upgrade_value% <text_color>➜ <secondary_color>%parameter_upgrade_nextValue%"
              - "  <text_color>Prix : <secondary_color>%parameter_upgrade_price% %parameter_upgrade_currencyDisplay%"
              - ""
              - "<white>%img_icons:left-click% <information_color>Améliorer au niveau %parameter_upgrade_nextLevel%"
    lore:
      - ""
      - "%lore-modifiers_progress%"
    taints:
      - "upgrade"
    click-requirements:
      - "[compare] %skyblock_player_island_hasPermission_RANKUP% == true"
    actions:
      - "[purchase-upgrade] %parameters_island% %parameter_upgrade_type%"
      - "[refresh-layout] upgrade <delay=4>"

  back:
    slot: 49
    copy-from: "%stacksuppliers_ce_icons:back%"
    name: "<bold><primary_color>Retour"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-main:island=%parameters_island%"

  previous-page:
    slot: 46
    copy-from: "%stacksuppliers_ce_icons:thin_back%"
    name: "<primary_color><bold>Page précédente"
    actions:
      - "[previous-page] upgrade"
      - "[refresh-slot] 52 <delay=1>"
      - "[refresh-slot] 46 <delay=1>"
    view-requirements:
      - "[compare] %layouts_upgrades_hasPreviousPage% == true"

  next-page:
    slot: 52
    copy-from: "%stacksuppliers_ce_icons:thin_next%"
    name: "<primary_color><bold>Page suivante"
    actions:
      - "[next-page] upgrade"
      - "[refresh-slot] 52 <delay=1>"
      - "[refresh-slot] 46 <delay=1>"
    view-requirements:
      - "[compare] %layouts_upgrades_hasNextPage% == true"
