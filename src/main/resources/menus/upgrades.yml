id: "island-upgrades"
title: "Améliorations"
size: 54
use-player-inventory: true

layouts:
  upgrades:
    taint: "upgrade"
    provider: "%parameters_island_upgrades%"

items:
  upgrade:
    slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
    copy-from: "%parameter_upgrade_item%"
    name: "<primary_color><bold>%parameter_upgrade_name%"
    lore:
      - ""
      - "$apply-transformer(upgrade-progress)"
    taints:
      - "upgrade"
    click-requirements:
      - "[compare] %parameters_island_hasPermission_RANKUP% == true"
    actions:
      - "[purchase-upgrade] %parameters_island% %parameter_upgrade_type%"
      - "[refresh-layout] upgrade <delay=4>"

  back:
    slot: 49
    material: "ARROW"
    name: "<bold><primary_color>Retour"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-main:island=%parameters_island%"

  previous-page:
    slot: 46
    material: "SPECTRAL_ARROW"
    name: "<primary_color><bold>Page précédente"
    actions:
      - "[previous-page] upgrade"
      - "[refresh-slot] 52 <delay=1>"
      - "[refresh-slot] 46 <delay=1>"
    view-requirements:
      - "[compare] %layouts_upgrades_hasPreviousPage% == true"

  next-page:
    slot: 52
    material: "SPECTRAL_ARROW"
    name: "<primary_color><bold>Page suivante"
    actions:
      - "[next-page] upgrade"
      - "[refresh-slot] 52 <delay=1>"
      - "[refresh-slot] 46 <delay=1>"
    view-requirements:
      - "[compare] %layouts_upgrades_hasNextPage% == true"
