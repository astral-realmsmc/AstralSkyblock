id: "island-main"
title: "Votre île"
size: 54
use-player-inventory: true

items:
  # Selected island
  island:
    slot: 4
    copy-from: "%parameters_island_owner_player_head%"
    name: "<bold><primary_color>%parameters_island_name%"
    lore:
      - ""
      - "<#26d971><bold>| Informations"
      - "  <gray>- <#e3dbcc>Chef : <secondary_color>%parameters_island_owner_player_name%"
      - "  <gray>- <#e3dbcc>Niveau : <secondary_color>%parameters_island_level%"
      - "  <gray>- <#e3dbcc>Membres : <secondary_color>%parameters_island_members_size%"
      - ""
      - "<white>Clic gauche <information_color>Pour vous téléporter"
      - "<secondary_color><italic>Raccourci</italic> <information_color>: /is go"
    actions:
      - "[player] is go"
  # Members
  members:
    slot: 20
    material: "PLAYER_HEAD"
    priority: 2
    name: "<bold><primary_color>Membres"
    lore:
      - ""
      - "  <text_color>Permet de voir les <secondary_color>membres"
      - "  <text_color>présents sur l'<secondary_color>île<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu des membres"
    actions:
      - "[open-menu] island-members:island=%parameters_island%"
  # Roles
  roles:
    slot: 21
    material: "BOOK"
    priority: 2
    name: "<bold><primary_color>Rôles"
    lore:
      - ""
      - "  <text_color>Permet de modifier les <secondary_color>rôles"
      - "  <text_color>de l'<secondary_color>île<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu des rôles"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_SET_ROLE% == true"
    actions:
      - "[open-menu] island-roles:island=%parameters_island%"
  roles-forbidden:
    slot: 21
    material: "BARRIER"
    name: "<bold><primary_color>Rôles"
    lore:
      - ""
      - "<red>Vous n'avez pas la permission"
      - "<red>d'accéder à ce menu."
  # Settings
  settings:
    slot: 22
    material: "REDSTONE"
    priority: 2
    name: "<bold><primary_color>Paramètres de l'île"
    lore:
      - ""
      - "  <text_color>Permet de modifier les <secondary_color>paramètres <text_color>de l'<secondary_color>île."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu de paramètres"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_SET_SETTINGS% == true"
    actions:
      - "[open-menu] island-settings:island=%parameters_island%"
  settings-forbidden:
    slot: 22
    material: "BARRIER"
    name: "<bold><primary_color>Paramètres de l'île"
    lore:
      - ""
      - "<red>Vous n'avez pas la permission"
      - "<red>d'accéder à ce menu."
  # Coops
  coops:
    slot: 23
    material: "LEAD"
    priority: 2
    name: "<bold><primary_color>Coopérateurs"
    lore:
      - ""
      - "  <text_color>Permet de gérer les <secondary_color>coopérateurs"
      - "  <text_color>de l'<secondary_color>île<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu des coopérateurs"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_COOP_MEMBER% == true"
    actions:
      - "[open-menu] island-coops:island=%parameters_island%"
  coops-forbidden:
    slot: 23
    material: "BARRIER"
    name: "<bold><primary_color>Coopérateurs"
    lore:
      - ""
      - "<red>Vous n'avez pas la permission"
      - "<red>d'accéder à ce menu."
  # Warps
  warps:
    slot: 30
    material: "LODESTONE"
    priority: 2
    name: "<bold><primary_color>Warps"
    lore:
      - ""
      - "  <text_color>Permet de gérer les <secondary_color>warps"
      - "  <text_color>de l'<secondary_color>île<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu des warps"
    actions:
      - "[open-menu] island-warps:island=%parameters_island%"
  # Upgrades
  upgrades:
    slot: 32
    material: "EXPERIENCE_BOTTLE"
    priority: 2
    name: "<bold><primary_color>Améliorations"
    lore:
      - ""
      - "  <text_color>Permet d'améliorer les <secondary_color>capacités"
      - "  <text_color>de l'<secondary_color>île<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu des améliorations"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_RANKUP% == true"
    actions:
      - "[open-menu] island-upgrades:island=%parameters_island%"
  upgrades-forbidden:
    slot: 32
    material: BARRIER
    name: "<bold><primary_color>Améliorations"
    lore:
      - ""
      - "<red>Vous n'avez pas la permission"
      - "<red>d'accéder à ce menu."
  # Open / close to visitors
  close:
    slot: 31
    material: "IRON_DOOR"
    priority: 2
    name: "<bold><primary_color>Fermer l'île"
    lore:
      - ""
      - "  <text_color>Empêche les <secondary_color>visiteurs <text_color>d'entrer sur l'île."
      - ""
      - "<white>Clic gauche <information_color>Fermer l'île"
    view-requirements:
      - "[compare] %parameters_island_locked% == false"
      - "[compare] %parameters_island_hasPermission_CLOSE_ISLAND% == true"
    actions:
      - "[player] is close"
      - "[refresh] <delay=10>"
  open:
    slot: 31
    material: "OAK_DOOR"
    priority: 2
    name: "<bold><primary_color>Ouvrir l'île"
    lore:
      - ""
      - "  <text_color>Autorise de nouveau les <secondary_color>visiteurs<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir l'île"
    view-requirements:
      - "[compare] %parameters_island_locked% == true"
      - "[compare] %parameters_island_hasPermission_OPEN_ISLAND% == true"
    actions:
      - "[player] is open"
      - "[refresh] <delay=10>"
  # Rename
  rename:
    slot: 38
    material: "NAME_TAG"
    priority: 2
    name: "<bold><primary_color>Renommer l'île"
    lore:
      - ""
      - "<white>Clic gauche <information_color>Choisir un nouveau nom"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_CHANGE_NAME% == true"
    actions:
      - "[close]"
      - "[open-dialog] island-rename:island=%parameters_island%"
  # Home
  sethome:
    slot: 39
    material: "RED_BED"
    priority: 2
    name: "<bold><primary_color>Définir le point d'apparition"
    lore:
      - ""
      - "  <text_color>Place le <secondary_color>spawn <text_color>de l'île là où vous êtes."
      - ""
      - "<white>Clic gauche <information_color>Définir ici"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_SET_HOME% == true"
    actions:
      - "[close]"
      - "[player] is sethome"
  # Leaderboard
  top:
    slot: 40
    material: "GOLD_INGOT"
    priority: 2
    name: "<bold><primary_color>Classement"
    lore:
      - ""
      - "<white>Clic gauche <information_color>Voir les meilleures îles"
    actions:
      - "[player] is top"
  # Level
  level:
    slot: 41
    material: "EXPERIENCE_BOTTLE"
    priority: 2
    name: "<bold><primary_color>Recalculer le niveau"
    lore:
      - ""
      - "  <text_color>Niveau actuel : <secondary_color>%parameters_island_level%"
      - ""
      - "<white>Clic gauche <information_color>Recalculer"
    actions:
      - "[close]"
      - "[player] is calc"
  # Biome
  biome:
    slot: 42
    material: "GRASS_BLOCK"
    priority: 2
    name: "<bold><primary_color>Changer le biome"
    lore:
      - ""
      - "<white>Clic gauche <information_color>Choisir un biome"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_SET_BIOME% == true"
    actions:
      - "[close]"
      - "[open-dialog] island-biome:island=%parameters_island%"
  # Leave
  leave:
    slot: 29
    material: "OAK_DOOR"
    priority: 2
    name: "<bold><primary_color>Quitter l'île"
    lore:
      - ""
      - "  <text_color>Permet de <secondary_color>quitter <text_color>l'île."
      - ""
      - "<white>Clic gauche <information_color>Quitter l'île"
    view-requirements:
      - "[compare] %parameters_island_isOwner% == false"
    actions:
      - "[open-menu] island-confirm-leave:island=%parameters_island%"
  # Disband
  disband:
    slot: 33
    material: "TNT"
    priority: 2
    name: "<bold><red>Supprimer l'île"
    lore:
      - ""
      - "  <text_color>Permet de <red>supprimer <text_color>l'île"
      - "  <text_color>et tout ce qu'elle contient."
      - ""
      - "<white>Clic gauche <information_color>Supprimer l'île"
    view-requirements:
      - "[compare] %parameters_island_isOwner% == true"
    actions:
      - "[open-menu] island-confirm-disband:island=%parameters_island%"
  # Bans
  bans:
    slot: 24
    material: "IRON_BARS"
    priority: 2
    name: "<bold><primary_color>Joueurs bannis"
    item-flags:
      - HIDE_ATTRIBUTES
    lore:
      - ""
      - "  <text_color>Permet de gérer les <secondary_color>joueurs bannis"
      - "  <text_color>de l'<secondary_color>île<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le menu des bannis"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_BAN_MEMBER% == true"
    actions:
      - "[open-menu] island-bans:island=%parameters_island%"
  bans-forbidden:
    slot: 24
    material: "BARRIER"
    name: "<bold><primary_color>Joueurs bannis"
    lore:
      - ""
      - "<red>Vous n'avez pas la permission"
      - "<red>d'accéder à ce menu."
