id: "island-member-manage"
title: "Gestion du membre"
size: 54
use-player-inventory: true

items:
  member:
    slot: 4
    copy-from: "%parameters_member_player_head%"
    name: "<primary_color><bold>%parameters_member_player_name%"
    lore:
      - ""
      - "  <text_color>Rôle : <secondary_color>%parameters_member_role_name%"

  role:
    slot: 20
    material: "BOOK"
    name: "<bold><primary_color>Changer de rôle"
    lore:
      - ""
      - "  <text_color>Permet d'attribuer un <secondary_color>rôle <text_color>à ce membre."
      - ""
      - "<white>Clic gauche <information_color>Ouvrir le sélecteur de rôle"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_SET_ROLE% == true"
    actions:
      - "[open-menu] island-member-role:island=%parameters_island%:member=%parameters_member%"

  kick:
    slot: 22
    material: "IRON_DOOR"
    name: "<bold><red>Expulser"
    lore:
      - ""
      - "  <text_color>Permet d'<secondary_color>expulser <text_color>ce membre de l'île."
      - ""
      - "<white>Clic gauche <information_color>Expulser ce membre"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_KICK_MEMBER% == true"
    actions:
      - "[open-menu] island-confirm-kick:island=%parameters_island%:member=%parameters_member%"

  ban:
    slot: 24
    material: "IRON_BARS"
    name: "<bold><red>Bannir"
    item-flags:
      - HIDE_ATTRIBUTES
    lore:
      - ""
      - "  <text_color>Permet de <secondary_color>bannir <text_color>ce membre de l'île."
      - ""
      - "<white>Clic gauche <information_color>Bannir ce membre"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_BAN_MEMBER% == true"
    actions:
      - "[close]"
      - "[open-dialog] island-ban:island=%parameters_island%:member=%parameters_member%"

  promote:
    slot: 29
    material: "LIME_DYE"
    name: "<bold><green>Promouvoir"
    lore:
      - ""
      - "  <text_color>Donne à ce membre le <secondary_color>rôle suivant<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Promouvoir ce membre"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_PROMOTE_MEMBERS% == true"
    actions:
      - "[promote-member] %parameters_island% %parameters_member_playerId%"
      - "[open-menu] island-member-manage:island=%parameters_island%:member=%parameters_member% <delay=10>"

  demote:
    slot: 33
    material: "RED_DYE"
    name: "<bold><red>Rétrograder"
    lore:
      - ""
      - "  <text_color>Donne à ce membre le <secondary_color>rôle précédent<text_color>."
      - ""
      - "<white>Clic gauche <information_color>Rétrograder ce membre"
    view-requirements:
      - "[compare] %parameters_island_hasPermission_DEMOTE_MEMBERS% == true"
    actions:
      - "[demote-member] %parameters_island% %parameters_member_playerId%"
      - "[open-menu] island-member-manage:island=%parameters_island%:member=%parameters_member% <delay=10>"

  transfer:
    slot: 31
    material: "GOLDEN_HELMET"
    name: "<bold><gold>Transférer la propriété"
    lore:
      - ""
      - "  <text_color>Fait de ce membre le <secondary_color>chef <text_color>de l'île."
      - ""
      - "<white>Clic gauche <information_color>Transférer la propriété"
    item-flags:
      - HIDE_ATTRIBUTES
    view-requirements:
      - "[compare] %parameters_island_isOwner% == true"
    actions:
      - "[open-menu] island-confirm-transfer:island=%parameters_island%:member=%parameters_member%"

  back:
    slot: 49
    material: "ARROW"
    name: "<bold><primary_color>Retour"
    item-flags:
      - HIDE_ATTRIBUTES
    actions:
      - "[open-menu] island-members:island=%parameters_island%"
