roles:
  visitor:
    type: VISITOR
    weight: 0
    default: false
    name: "Visitor"
    icon:
      material: "stone"
      name: "Visitor"
    # Visitors get nothing by default: they may look around, and that is it. Grant
    # entries here (or through the in-game permissions menu) to loosen that.
    permissions: []
  co-op:
    type: COOP
    weight: 1
    default: false
    name: "Co-Op"
    icon:
      material: "gold_ingot"
      name: "Co-Op"
    # Trusted helpers: build, break and interact with the world,
    # but no island management and no warps.
    permissions:
      - BUILD
      - BREAK
      - BRUSH
      - DROP_ITEMS
      - PICKUP_DROPS
      - FLY
      - ANIMAL_BREED
      - ANIMAL_SHEAR
      - DYE_SHEEP
      - FERTILIZE
      - FISH
      - LEASH
      - NAME_ENTITY
      - SADDLE_ENTITY
      - ENTITY_RIDE
      - VILLAGER_TRADING
      - MINECART_ENTER
      - MINECART_OPEN
      - ENDER_PEARL
      - CHORUS_FRUIT
      - WIND_CHARGE
      - IGNITE_CREEPER
      - SCULK_SENSOR
  member:
    type: MEMBER
    weight: 2
    default: true
    name: "Member"
    icon:
      material: "iron_ingot"
      name: "Member"
    # Full islanders: everything a co-op can do, plus warps, the island
    # spawn, invites, expelling visitors and valuable/spawner harvesting.
    permissions:
      - BUILD
      - BREAK
      - BRUSH
      - DROP_ITEMS
      - PICKUP_DROPS
      - FLY
      - ANIMAL_BREED
      - ANIMAL_SHEAR
      - DYE_SHEEP
      - FERTILIZE
      - FISH
      - LEASH
      - NAME_ENTITY
      - SADDLE_ENTITY
      - ENTITY_RIDE
      - VILLAGER_TRADING
      - MINECART_ENTER
      - MINECART_OPEN
      - ENDER_PEARL
      - CHORUS_FRUIT
      - WIND_CHARGE
      - IGNITE_CREEPER
      - SCULK_SENSOR
      - SPAWNER_BREAK
      - VALUABLE_BREAK
      - SET_HOME
      - SET_WARP
      - DELETE_WARP
      - RANKUP
      - INVITE_MEMBER
      - COOP_MEMBER
      - UNCOOP_MEMBER
      - EXPEL_PLAYERS
  admin:
    type: MEMBER
    weight: 3
    default: false
    name: "Admin"
    icon:
      material: "diamond"
      name: "Admin"
    # Island administrators. ALL is a wildcard: it grants every permission,
    # DISBAND_ISLAND included. Replace it with an explicit list if you want to
    # hold something back — the owner is structural and bypasses checks anyway,
    # so nothing is lost by spelling this role out.
    permissions:
      - ALL
