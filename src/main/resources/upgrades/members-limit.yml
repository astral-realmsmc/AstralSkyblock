# Maximum number of members an island may hold. `value` is the cap itself; level 0 is the
# starting cap every island gets for free.
type: MEMBERS_LIMIT
levels:
  0:
    level: 0
    price: 0
    value: 5
  1:
    level: 1
    price: 5000
    currency: "default"
    currency-display: "coins"
    value: 7
  2:
    level: 2
    price: 15000
    currency: "default"
    currency-display: "coins"
    value: 10
  3:
    level: 3
    price: 40000
    currency: "default"
    currency-display: "coins"
    value: 15
