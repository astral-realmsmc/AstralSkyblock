name: AstralSkyblock
version: '${version}'
main: com.astralrealms.skyblock.AstralSkyblock
api-version: '1.21'
load: POSTWORLD
depend:
  - AstralCore
permissions:
  skyblock.admin:
    description: Bypasses every island permission and cooldown, and allows the admin commands (/is upgrade set).
    default: op
  skyblock.reload:
    description: Allows /skyblock reload.
    default: op
  skyblock.dimension.nether:
    description: Allows entering the nether of an island that has unlocked it (dimensions.yml).
    default: false
  skyblock.dimension.end:
    description: Allows entering the end of an island that has unlocked it (dimensions.yml).
    default: false
