id: "island-role-edit"
title: "<bold><primary_color>Modifier un rôle"
close-with-escape: true

body:
  intro:
    content: "<gray>Rôle actuel : <white>%parameters_role_name%</white> (poids <white>%parameters_role_weight%</white>)."
    width: 320

inputs:
  name:
    type: TEXT
    id: name
    label: "<gray>Nom du rôle"
    max-length: 16
    initial: "%parameters_role_name%"
  # A text field rather than a slider: a slider cannot start at the role's current weight, and
  # saving a rename would then silently re-weight the role. Left as is, the weight is kept.
  weight:
    type: TEXT
    id: weight
    label: "<gray>Poids (1-20)"
    max-length: 2
    initial: "%parameters_role_weight%"

yes-button:
  label: "<green>Enregistrer"
  actions:
    - "[edit-role] %parameters_island% %parameters_role% %input_weight% %input_name%"
no-button:
  label: "<gray>Annuler"
