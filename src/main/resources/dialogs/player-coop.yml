id: "island-coop"
title: "<bold><primary_color>Ajouter un coopérateur"
close-with-escape: true

inputs:
  name:
    type: TEXT
    id: name
    label: "<gray>Pseudo du joueur"
    max-length: 32

yes-button:
  label: "<green>Ajouter"
  tooltip: "<gray>Envoie une invitation de coopération"
  actions:
    - "[coop-player] %parameters_island% %input_name%"
no-button:
  label: "<gray>Annuler"
