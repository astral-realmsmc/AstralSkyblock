# Server settings
maximum-islands: 100
islands-group: "islands"

# Unload an island world after it has had no players for this many seconds.
# 0 uses the 5 minute default; a negative value disables idle unloading.
world-idle-unload-seconds: 300

# Server group players are sent to when they are evicted from an island (e.g. on a ban).
fallback-group: "hub"

# Maximum number of warps an island may define. 0 uses the default of 1.
maximum-warps: 1

# Baseline values used when the matching upgrade has no blueprint configured — an island always
# has a member cap, a border and so on, whether or not the upgrade behind it exists.
defaults:
  member-limit: 5
  coop-limit: 5
  world-border-size: 100
  hopper-limit: 32
  minecart-limit: 16
  # Multipliers. 1.0 is vanilla behaviour; these are what an island gets before any upgrade.
  crop-growth-multiplier: 1.0
  spawner-rate-multiplier: 1.0
  mob-drops-multiplier: 1.0

# Island scoring. An island's value is the sum of its blocks' worth (block-values.yml);
# its level is that value divided by points-per-level.
level:
  points-per-level: 100
  # Chunks snapshotted per tick while scanning an island.
  chunks-per-batch: 4
  # Seconds between automatic rescans of the islands hosted by a server. Negative disables them.
  rescan-interval-seconds: 900
  # Seconds a player must wait between two /is calc runs on the same island. Negative disables it.
  cooldown-seconds: 60
  # Leaderboard size and refresh rate.
  top-size: 50
  top-refresh-seconds: 300

# Generators
generators:
  enabled: true
  default: "overworld"

# Settings
default-settings:
  - CROPS_GROWTH
  - EGG_LAY
  - ENDERMAN_GRIEF
  - FIRE_SPREAD
  - GHAST_FIREBALL
  - LAVA_FLOW
  - PVP
  - TNT_EXPLOSION
  - TREE_GROWTH
  - WATER_FLOW
  - WITHER_EXPLOSION