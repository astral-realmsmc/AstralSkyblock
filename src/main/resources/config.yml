# Server settings
maximum-islands: 100
islands-group: "islands"

# Unload an island world after it has had no players for this many seconds.
# 0 uses the 5 minute default; a negative value disables idle unloading.
world-idle-unload-seconds: 300

# Generators
generators:
  enabled: true
  default: "overworld"

# Settings
default-settings:
  - CROPS_GROWTH
  - EGG_LAY
  - ENDERMAN_GRIEF
  - FIRE_SPREAD
  - GHAST_FIREBALL
  - LAVA_FLOW
  - PVP
  - TNT_EXPLOSION
  - TREE_GROWTH
  - WATER_FLOW
  - WITHER_EXPLOSION